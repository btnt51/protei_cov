image: ubuntu:24.04
stages: [test]
build-and-test:
  stage: test
  parallel:
    matrix:
      - CXX: [g++-13, clang++-18]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build g++-13 clang-18 libboost1.83-dev python3
  script:
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER="$CXX" -DWITH_TESTS=ON
    - cmake --build build --parallel 2
    - ctest --test-dir build --output-on-failure --no-tests=error --output-junit junit.xml
  artifacts:
    when: always
    name: "$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    reports:
      junit: build/junit.xml
    paths:
      - build/junit.xml
      - build/Testing/Temporary/LastTest.log
      - build/protei_cov
      - build/base.json
