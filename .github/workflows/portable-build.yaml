name: GCC and Clang
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-13, clang++-18]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++-13 clang-18 libboost1.83-dev python3
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DWITH_TESTS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --no-tests=error --output-junit junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.compiler }}
          path: build/junit.xml
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install boost ninja
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DWITH_TESTS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --no-tests=error --output-junit junit.xml
